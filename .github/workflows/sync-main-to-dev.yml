name: Sync main into dev

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-main-to-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether dev is behind main
        id: check
        run: |
          git fetch origin main dev

          if [ "$(git rev-list --count origin/dev..origin/main)" -gt 0 ]; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing sync PR
        if: steps.check.outputs.needs_sync == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_PR=$(gh pr list \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          echo "number=$EXISTING_PR" >> "$GITHUB_OUTPUT"

      - name: Create sync PR
        if: >
          steps.check.outputs.needs_sync == 'true' &&
          steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "Sync main into dev" \
            --body "Automatically created because main contains commits that are not yet in dev."

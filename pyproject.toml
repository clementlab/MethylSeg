[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "methylseg"
version = "0.1.0"
description = "Methylation segmentation utilities used in the TCGA methylation analysis repo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cthmm>=0.0.3",
  "hmmlearn>=0.3.3",
  "joblib>=1.5",
  "matplotlib>=3.8",
  "numba>=0.60",
  "numpy>=1.26",
  "pandas>=2.2",
  "panel>=1.4",
  "plotly>=5.24",
  "pybedtools>=0.12.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "umap-learn>=0.5",
]

[project.optional-dependencies]
docs = [
  "ipykernel",
  "nbsphinx>=0.9.6",
  "Sphinx>=7.4.7",
  "sphinx-autobuild>=2024.4.16",
  "sphinx-rtd-theme>=2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["methylseg*"]
